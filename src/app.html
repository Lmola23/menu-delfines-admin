<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" />
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Confirmación mínima para los formularios de borrado. No depende de
			// la hidratación de Svelte: el admin se sirve como HTML + CSS.
			document.addEventListener("submit", (event) => {
				const form = event.target;
				if (!(form instanceof HTMLFormElement)) return;
				const message = form.dataset.confirm;
				if (message && !confirm(message)) event.preventDefault();
			});
		</script>

		<script>
			// Menú de secciones nativo. Se cierra al tocar fuera, con el fondo
			// oscuro, con la X o con Escape, sin hidratar el resto del admin.
			(() => {
				const menu = document.querySelector("[data-admin-menu]");
				if (!(menu instanceof HTMLDetailsElement)) return;

				const trigger = menu.querySelector("summary");
				const panel = menu.querySelector(".admin-menu-panel");
				const firstLink = menu.querySelector(".admin-menu-links a");

				document.addEventListener("click", (event) => {
					if (!menu.open) return;
					if (!(event.target instanceof Element)) return;
					if (event.target.closest("[data-menu-close]")) {
						menu.open = false;
						return;
					}
					if (!menu.contains(event.target)) menu.open = false;
				});

				document.addEventListener("keydown", (event) => {
					if (event.key !== "Escape" || !menu.open) return;
					menu.open = false;
					trigger?.focus();
				});

				menu.addEventListener("keydown", (event) => {
					if (event.key !== "Tab" || !menu.open || !panel) return;

					const focusable = Array.from(
						panel.querySelectorAll("a, button"),
					).filter((element) => !element.hasAttribute("disabled"));
					if (focusable.length === 0) return;

					const first = focusable[0];
					const last = focusable[focusable.length - 1];
					if (event.shiftKey && document.activeElement === first) {
						event.preventDefault();
						last.focus();
					} else if (!event.shiftKey && document.activeElement === last) {
						event.preventDefault();
						first.focus();
					}
				});

				menu.addEventListener("toggle", () => {
					document.body.style.overflow = menu.open ? "hidden" : "";
					if (menu.open) {
						firstLink?.focus();
					} else {
						trigger?.focus();
					}
				});
			})();
		</script>

		<script>
			// Buscador instantáneo, igual que el del menú público. Es JavaScript
			// nativo: no descarga el bundle de hidratación de SvelteKit. Si el
			// navegador no lo ejecuta, el formulario GET sigue filtrando en servidor.
			(() => {
				const root = document.querySelector("[data-search-root]");
				const input = root?.querySelector("[data-search-input]");
				if (!root || !(input instanceof HTMLInputElement)) return;

				const items = Array.from(root.querySelectorAll("[data-product]")).map(
					(element) => ({
						element,
						search: element.dataset.search ?? "",
					}),
				);
				const categoryGroups = Array.from(
					root.querySelectorAll("[data-category-group]"),
				).map((element) => ({
					element,
					products: Array.from(element.querySelectorAll("[data-product]")),
				}));
				const filters = root.querySelector("[data-filters]");
				const empty = root.querySelector("[data-search-empty]");
				const status = root.querySelector("[data-search-status]");
				const count = root.querySelector("[data-search-count]");
				const submit = root.querySelector("[data-search-submit]");
				const clear = root.querySelector("[data-search-clear]");
				const queryInputs = Array.from(
					root.querySelectorAll("[data-search-query]"),
				);
				const form = input.form;
				const defaultCount = count?.dataset.defaultLabel ?? "";
				const scopeLabel = count?.dataset.scopeLabel ?? "";
				const clearHref = clear?.getAttribute("href") ?? null;

				const normalize = (value) =>
					value
						.normalize("NFD")
						.replace(/[\u0300-\u036f]/g, "")
						.toLowerCase()
						.replace(/\s+/g, " ")
						.trim();

				const apply = () => {
					const raw = input.value;
					const tokens = normalize(raw).split(" ").filter(Boolean);
					const searching = tokens.length > 0;
					let visible = 0;

					for (const { element, search } of items) {
						const matches =
							!searching || tokens.every((token) => search.includes(token));
						element.hidden = !matches;
						if (matches) visible += 1;
					}

					// La cabecera de una categoría solo se muestra si queda al menos
					// un producto visible dentro de ella.
					for (const group of categoryGroups) {
						group.element.hidden = !group.products.some(
							(product) => !product.hidden,
						);
					}

					for (const queryInput of queryInputs) {
						queryInput.value = raw.trim();
					}

					if (filters) filters.hidden = searching;
					if (empty) empty.hidden = !searching || visible > 0;
					if (submit) submit.hidden = raw.length > 0;
					if (clear) clear.hidden = raw.length === 0;

					if (count) {
						count.textContent = searching
							? `${visible} ${visible === 1 ? "resultado" : "resultados"}${scopeLabel}`
							: defaultCount;
					}

					if (status) {
						status.textContent = !searching
							? ""
							: visible === 0
								? `Sin resultados para "${raw.trim()}"`
								: `${visible} ${visible === 1 ? "producto encontrado" : "productos encontrados"}`;
					}

					// Si se borra la consulta a mano, la URL vuelve al listado sin `q`.
					if (!searching && clearHref) {
						history.replaceState({}, "", clearHref);
					}
				};

				const clearSearch = () => {
					input.value = "";
					apply();
					if (clearHref) history.replaceState({}, "", clearHref);
					input.focus();
				};

				input.addEventListener("input", apply);
				input.addEventListener("search", () => {
					if (input.value === "") clearSearch();
					else apply();
				});

				input.addEventListener("keydown", (event) => {
					if (event.key === "Escape" && input.value !== "") {
						event.preventDefault();
						clearSearch();
					}
				});

				clear?.addEventListener("click", (event) => {
					event.preventDefault();
					clearSearch();
				});

				form?.addEventListener("submit", (event) => {
					event.preventDefault();
					const value = input.value.trim();
					const url = new URL(location.href);
					if (value) url.searchParams.set("q", value);
					else url.searchParams.delete("q");
					history.replaceState({}, "", url);
					apply();
				});

				apply();
			})();
		</script>

		<script>
			// La flecha de volver arriba solo aparece cuando el encabezado de la
			// lista ya no está visible. IntersectionObserver evita un listener de
			// scroll y funciona con el SSR, sin hidratación.
			(() => {
				const button = document.querySelector("[data-scroll-top]");
				const target = document.querySelector("[data-scroll-top-target]");
				if (!button || !target || !("IntersectionObserver" in window)) return;

				const observer = new IntersectionObserver(([entry]) => {
					button.hidden = entry.isIntersecting;
				});
				observer.observe(target);
			})();
		</script>
	</body>
</html>
